<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Logo Forge</title>

    <!--
      Panneau CEP de Logo Forge.

      Contraintes tenues dans tout ce fichier, pour le Chromium figé de CEP
      (61 en CEP 9, ~74 en CEP 10) :
        - ES5 : pas de `?.`, pas de `??`, pas d'arrow, pas de `const` ;
        - pas de `gap` en flexbox (Chrome 84) — les gouttières passent par des
          marges ou des `float` ;
        - pas de `inset` (Chrome 87), pas de `rgb(r g b / a%)` (Chrome 65) ;
        - pas d'unité `vh` : la mise en page est ancrée en positionnement absolu.

      L'export lui-même vit dans js/export-engine.js et jsx/main.jsx.
    -->

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #252525;
        color: #e3e3e3;
        font-family: 'Adobe Clean', adobe-clean, system-ui, -apple-system,
          'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 4px;
        background: #5a5a5a;
        background-clip: content-box;
      }

      /* ---- Structure ---- */

      .panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }

      .panel-header {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 44px;
        padding: 0 12px;
        border-bottom: 1px solid #3e3e3e;
        background: #2f2f2f;
      }

      .tabs {
        position: absolute;
        top: 44px;
        right: 0;
        left: 0;
        height: 34px;
        border-bottom: 1px solid #3e3e3e;
        background: #2f2f2f;
      }

      .panel-body {
        position: absolute;
        top: 78px;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 12px 12px 84px;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .panel-footer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 12px;
        border-top: 1px solid #3e3e3e;
        background: #2f2f2f;
      }

      /* ---- En-tête ---- */

      .brand {
        position: absolute;
        top: 13px;
        left: 12px;
      }
      .brand-name {
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
      }
      .brand-version {
        margin-left: 5px;
        font-size: 10px;
        color: #909090;
      }
      .connection {
        position: absolute;
        top: 15px;
        right: 12px;
        font-size: 10px;
        color: #909090;
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 5px;
        border-radius: 50%;
        background: #6e6e6e;
        vertical-align: middle;
      }
      .status-dot.on {
        background: #2d9d78;
      }
      .status-dot.partial {
        background: #e68619;
      }
      .status-dot.off {
        background: #e34850;
      }

      /* ---- Onglets ---- */

      .tab {
        float: left;
        height: 33px;
        padding: 0 14px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #909090;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
      }
      .tab:hover {
        color: #e3e3e3;
      }
      .tab.on {
        border-bottom-color: #2680eb;
        color: #ffffff;
      }

      .pane {
        display: none;
      }
      .pane.on {
        display: block;
      }

      /* ---- Sections ---- */

      .section {
        margin-bottom: 16px;
      }
      .section-title {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #909090;
      }
      .section-count {
        float: right;
        font-weight: 400;
        letter-spacing: 0;
      }
      .card {
        padding: 8px 10px;
        border: 1px solid #3e3e3e;
        border-radius: 4px;
        background: #2f2f2f;
      }
      .card.empty {
        border-style: dashed;
        border-color: #4a4a4a;
      }
      .doc-name {
        margin: 0;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .card.empty .doc-name {
        color: #e68619;
      }
      .doc-meta {
        margin: 2px 0 0;
        font-size: 11px;
        color: #909090;
      }
      .icon-button {
        float: right;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid #3e3e3e;
        border-radius: 4px;
        background: transparent;
        color: #909090;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .icon-button:hover {
        border-color: #4a4a4a;
        background: #323232;
        color: #e3e3e3;
      }

      /* ---- Composants ---- */

      .comp-grid {
        margin: 0 -3px;
        overflow: hidden;
      }
      .comp-cell {
        float: left;
        width: 50%;
        padding: 0 3px 6px;
      }
      .comp-card {
        position: relative;
        padding: 8px;
        border: 1px solid #3e3e3e;
        border-radius: 4px;
        background: #2f2f2f;
      }
      .comp-preview {
        height: 46px;
        margin-bottom: 6px;
        border-radius: 3px;
        background: #4a4a4a;
        color: #909090;
        font-size: 10px;
        line-height: 46px;
        text-align: center;
      }
      .comp-name {
        width: 100%;
        padding: 3px 5px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        color: #e3e3e3;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
      }
      .comp-name:focus {
        border-color: #2680eb;
        background: #252525;
        outline: none;
      }
      .comp-board {
        width: 100%;
        margin-top: 4px;
        padding: 3px 4px;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        background: #252525;
        color: #e3e3e3;
        font-family: inherit;
        font-size: 10px;
      }
      .comp-remove {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: #6e6e6e;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }
      .comp-remove:hover {
        background: #e34850;
        color: #ffffff;
      }

      /* ---- Cases à cocher ---- */

      .check-row {
        display: block;
        padding: 4px 2px;
        cursor: pointer;
      }
      .check-row.disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .check-row input {
        width: 13px;
        height: 13px;
        margin: 0 7px 0 0;
        vertical-align: middle;
      }
      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        border: 1px solid #5a5a5a;
        border-radius: 2px;
        vertical-align: middle;
      }
      .badge {
        margin-left: 6px;
        padding: 1px 5px;
        border-radius: 8px;
        background: #323232;
        color: #909090;
        font-size: 9px;
        font-weight: 700;
      }

      /* ---- Champs ---- */

      .field-label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        color: #909090;
      }
      input[type='text'],
      input[type='number'],
      select {
        width: 100%;
        margin-bottom: 8px;
        padding: 5px 8px;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        background: #252525;
        color: #e3e3e3;
        font-family: inherit;
        font-size: 12px;
      }
      input:focus,
      select:focus {
        border-color: #2680eb;
        outline: none;
      }
      .destination {
        margin: 6px 0 0;
        overflow: hidden;
        font-family: 'Source Code Pro', monospace;
        font-size: 10px;
        color: #909090;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .destination.empty {
        font-style: italic;
      }

      .row {
        margin: 0 -3px 6px;
        overflow: hidden;
      }
      .col {
        float: left;
        width: 50%;
        padding: 0 3px;
      }
      .col-4 {
        float: left;
        width: 25%;
        padding: 0 3px;
      }
      .col label {
        display: block;
        margin-bottom: 3px;
        font-size: 10px;
        color: #909090;
      }
      .col-4 label {
        display: block;
        margin-bottom: 3px;
        font-size: 10px;
        color: #909090;
      }

      /* ---- Listes d'échelles et de couleurs ---- */

      .list-row {
        margin-bottom: 4px;
        padding: 6px 8px;
        border: 1px solid #3e3e3e;
        border-radius: 4px;
        background: #2f2f2f;
        overflow: hidden;
      }
      .list-row .label {
        float: left;
        font-size: 11px;
        line-height: 20px;
      }
      .list-row .meta {
        float: left;
        margin-left: 8px;
        color: #909090;
        font-size: 10px;
        line-height: 20px;
      }
      .list-row .kill {
        float: right;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: transparent;
        color: #6e6e6e;
        cursor: pointer;
      }
      .list-row .kill:hover {
        background: #e34850;
        color: #ffffff;
      }

      /* ---- Messages ---- */

      .summary {
        margin: 0 0 12px;
        padding: 6px 8px;
        border-radius: 4px;
        background: #2f2f2f;
        color: #909090;
        font-size: 11px;
      }
      .notice {
        margin: 0 0 8px;
        padding: 6px 8px;
        border-left: 3px solid #e68619;
        border-radius: 0 4px 4px 0;
        background: #2f2f2f;
        color: #e68619;
        font-size: 11px;
        line-height: 1.4;
      }
      .notice.error {
        border-left-color: #e34850;
        color: #e34850;
      }
      .notice.ok {
        border-left-color: #2d9d78;
        color: #2d9d78;
      }

      /* ---- Boutons ---- */

      .button {
        display: block;
        width: 100%;
        padding: 7px 12px;
        border: 1px solid #4a4a4a;
        border-radius: 14px;
        background: transparent;
        color: #e3e3e3;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .button:hover {
        background: #323232;
      }
      .button.primary {
        border-color: #2680eb;
        background: #2680eb;
        color: #ffffff;
        font-weight: 700;
      }
      .button.primary:hover {
        border-color: #1473e6;
        background: #1473e6;
      }
      .button.small {
        padding: 5px 10px;
        border-radius: 12px;
        font-size: 11px;
      }
      .button[disabled] {
        border-color: #4a4a4a;
        background: #4a4a4a;
        color: #909090;
        cursor: not-allowed;
      }

      /* ---- Modale et progression ---- */

      .veil {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: none;
        background: rgba(15, 15, 15, 0.72);
      }
      .veil.on {
        display: block;
      }
      .dialog {
        position: absolute;
        top: 50%;
        right: 12px;
        left: 12px;
        max-height: 88%;
        margin-top: -170px;
        padding: 14px;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        background: #2f2f2f;
        overflow-y: auto;
      }
      .dialog h3 {
        margin: 0 0 12px;
        font-size: 13px;
        color: #ffffff;
      }
      .progress {
        position: relative;
        height: 18px;
        margin: 10px 0 8px;
        border-radius: 4px;
        background: #4a4a4a;
        overflow: hidden;
      }
      .progress-bar {
        width: 0;
        height: 100%;
        background: #2680eb;
      }
      .progress-label {
        overflow: hidden;
        color: #909090;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <div class="panel-header">
        <div class="brand">
          <span class="brand-name">Logo Forge</span>
          <span class="brand-version">v0.1.0</span>
        </div>
        <div class="connection">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-label">…</span>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="components">Composants</button>
        <button class="tab" data-tab="colors">Couleurs</button>
        <button class="tab" data-tab="settings">Réglages</button>
      </div>

      <div class="panel-body">
        <!-- Onglet Composants -->
        <div class="pane on" id="pane-components">
          <div class="section">
            <h2 class="section-title">
              Document
              <button class="icon-button" id="refresh" title="Re-détecter">
                &#8635;
              </button>
            </h2>
            <div id="document-card"></div>
          </div>

          <div class="section">
            <h2 class="section-title">
              Composants <span class="section-count" id="comp-count"></span>
            </h2>
            <div class="comp-grid" id="comp-grid"></div>
            <button class="button small" id="add-component">
              + Ajouter un composant
            </button>
          </div>
        </div>

        <!-- Onglet Couleurs -->
        <div class="pane" id="pane-colors">
          <div class="section">
            <h2 class="section-title">Déclinaisons</h2>
            <div id="scheme-list"></div>
          </div>

          <div class="section">
            <h2 class="section-title">Couleurs personnalisées</h2>
            <div id="custom-list"></div>
            <div class="row">
              <div class="col">
                <label for="custom-name">Nom</label>
                <input type="text" id="custom-name" placeholder="Bleu marque" />
              </div>
              <div class="col">
                <label for="custom-hex">Couleur</label>
                <input type="text" id="custom-hex" value="#2680eb" />
              </div>
            </div>
            <button class="button small" id="add-custom">+ Couleur</button>
          </div>
        </div>

        <!-- Onglet Réglages -->
        <div class="pane" id="pane-settings">
          <div class="tabs" id="subtabs" style="position: static; height: auto; border: 0; background: transparent; margin-bottom: 10px; overflow: hidden">
            <button class="tab on" data-sub="files">Fichiers</button>
            <button class="tab" data-sub="names">Noms</button>
            <button class="tab" data-sub="scales">Échelles</button>
            <button class="tab" data-sub="padding">Marges</button>
          </div>

          <div class="pane on" id="sub-files">
            <div class="section">
              <h2 class="section-title">Formats</h2>
              <div id="format-list"></div>
              <label class="check-row">
                <input type="checkbox" id="want-favicon" checked />Générer les
                favicons (16, 32, 128, 180, 192 px)
              </label>
            </div>
          </div>

          <div class="pane" id="sub-names">
            <div class="section">
              <h2 class="section-title">Séparateur</h2>
              <select id="separator">
                <option value="-">Tiret — Logo-FullColor.svg</option>
                <option value="_">Underscore — Logo_FullColor.svg</option>
                <option value=" ">Espace — Logo FullColor.svg</option>
              </select>
              <p class="summary" id="name-preview"></p>
            </div>
          </div>

          <div class="pane" id="sub-scales">
            <div class="section">
              <h2 class="section-title">Préréglage</h2>
              <select id="scale-preset">
                <option value="default">Défaut — web + print</option>
                <option value="web">Web seul</option>
                <option value="print">Print seul</option>
              </select>
            </div>
            <div class="section">
              <h2 class="section-title">Échelles</h2>
              <div id="scale-list"></div>
              <div class="row">
                <div class="col-4">
                  <label for="scale-type">Type</label>
                  <select id="scale-type">
                    <option value="web">Web</option>
                    <option value="print">Print</option>
                  </select>
                </div>
                <div class="col-4">
                  <label for="scale-width">Largeur px</label>
                  <input type="number" id="scale-width" value="900" min="1" />
                </div>
                <div class="col-4">
                  <label for="scale-dpi">ppp</label>
                  <input type="number" id="scale-dpi" value="72" min="1" />
                </div>
                <div class="col-4">
                  <label>&nbsp;</label>
                  <button class="button small" id="add-scale">+</button>
                </div>
              </div>
            </div>
          </div>

          <div class="pane" id="sub-padding">
            <div class="section">
              <h2 class="section-title">Marges autour du logo (px)</h2>
              <label class="check-row">
                <input type="radio" name="padmode" value="square" checked />Carré
                — une seule valeur
              </label>
              <label class="check-row">
                <input type="radio" name="padmode" value="individual" />Individuel
                — quatre valeurs
              </label>
              <div class="row" id="padding-fields">
                <div class="col-4">
                  <label for="pad-top">Haut</label>
                  <input type="number" id="pad-top" value="0" min="0" />
                </div>
                <div class="col-4">
                  <label for="pad-right">Droite</label>
                  <input type="number" id="pad-right" value="0" min="0" />
                </div>
                <div class="col-4">
                  <label for="pad-bottom">Bas</label>
                  <input type="number" id="pad-bottom" value="0" min="0" />
                </div>
                <div class="col-4">
                  <label for="pad-left">Gauche</label>
                  <input type="number" id="pad-left" value="0" min="0" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="messages"></div>
      </div>

      <div class="panel-footer">
        <button class="button primary" id="open-export" disabled>
          Exporter le package logo
        </button>
      </div>

      <!-- Modale d'export -->
      <div class="veil" id="export-veil">
        <div class="dialog">
          <h3>Exporter le package</h3>
          <label class="field-label" for="client-name">Nom du client</label>
          <input type="text" id="client-name" placeholder="Ma Marque" />
          <button class="button small" id="choose-folder">
            Choisir le dossier&hellip;
          </button>
          <p class="destination empty" id="destination">Aucun dossier choisi</p>
          <p class="summary" id="export-summary"></p>
          <div id="export-error"></div>
          <div class="row">
            <div class="col">
              <button class="button small" id="cancel-export">Annuler</button>
            </div>
            <div class="col">
              <button class="button primary small" id="start-export" disabled>
                Exporter
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Progression -->
      <div class="veil" id="progress-veil">
        <div class="dialog">
          <h3 id="progress-title">Export en cours</h3>
          <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
          <p class="progress-label" id="progress-label">Préparation&hellip;</p>
          <div id="progress-result"></div>
          <button class="button small" id="abort-export">Annuler</button>
        </div>
      </div>
    </div>

    <!--
      CSInterface, quand l'hôte le met à disposition. Le panneau n'en dépend
      pas : il parle directement à window.__adobe_cep__, sur lequel CSInterface
      n'est qu'une surcouche. Un 404 sur cette ligne est sans conséquence.
    -->
    <script src="./CSInterface.js"></script>
    <script src="./js/export-engine.js"></script>

    <script>
      ;(function () {
        'use strict'

        /* ---------------------------------------------------------------- *
         * Filet de diagnostic
         * ---------------------------------------------------------------- */

        function showError(title, detail) {
          var host = document.querySelector('.panel-body') || document.body
          if (!host) return
          var box = document.getElementById('fatal')
          if (!box) {
            box = document.createElement('div')
            box.id = 'fatal'
            box.setAttribute(
              'style',
              'padding:12px;margin:8px 0;border:1px solid #e34850;' +
                'border-radius:4px;background:rgba(227,72,80,0.12);color:#ff6b6b;' +
                'font-family:monospace;font-size:11px;line-height:1.5;' +
                'white-space:pre-wrap;word-break:break-word'
            )
            host.appendChild(box)
          }
          box.appendChild(document.createTextNode(title + '\n' + detail + '\n\n'))
        }

        function describe(value) {
          if (value && value.message) {
            return value.message + '\n' + (value.stack || '(pile indisponible)')
          }
          return String(value)
        }

        window.onerror = function (message, source, line, column, error) {
          showError('Erreur JavaScript :', describe(error || message))
        }

        function guard(label, fn) {
          try {
            return fn()
          } catch (error) {
            showError('Erreur — ' + label + ' :', describe(error))
            return null
          }
        }

        // Le moteur est un fichier séparé : sans lui, on le dit plutôt que de
        // laisser un bouton inerte.
        if (typeof LogoForgeEngine === 'undefined') {
          showError(
            'Moteur introuvable :',
            'js/export-engine.js ne s’est pas chargé. Vérifiez que le dossier ' +
              'js/ accompagne index.html dans l’extension.'
          )
          return
        }
        var engine = LogoForgeEngine

        /* ---------------------------------------------------------------- *
         * Environnement
         * ---------------------------------------------------------------- */

        if (typeof CSInterface === 'undefined') {
          window.CSInterface = function () {}
          window.CSInterface.prototype.evalScript = function (script, cb) {
            if (cb) cb('')
          }
        }

        function detectEnvironment() {
          if (typeof window.__adobe_cep__ !== 'undefined') return 'cep'
          try {
            if (typeof require === 'function' && require('uxp')) return 'uxp'
          } catch (ignored) {
            /* pas d'hôte UXP */
          }
          return 'dev'
        }

        var ENVIRONMENT = detectEnvironment()
        var ENV_LABEL = {
          cep: { dot: 'on', text: 'CEP' },
          uxp: { dot: 'partial', text: 'UXP' },
          dev: { dot: 'off', text: 'Dev' },
        }

        /* ---------------------------------------------------------------- *
         * État
         * ---------------------------------------------------------------- */

        var DEFAULT_COMPONENTS = [
          'Logo',
          'Logo Mark',
          'Logotype',
          'Stacked Logo',
          'Vertical Logo',
          'Centered Logo',
        ]

        var SCHEMES = [
          { id: 'fullColor', label: 'Full Color', swatch: '#2680eb' },
          { id: 'black', label: 'Black', swatch: '#000000' },
          { id: 'white', label: 'White', swatch: '#ffffff' },
          { id: 'inverted', label: 'Inverted', swatch: '#d97fd9' },
          { id: 'grayscale', label: 'Grayscale', swatch: '#909090' },
        ]

        var FORMATS = [
          { id: 'ai', label: 'AI — source Illustrator' },
          { id: 'svg', label: 'SVG — vectoriel web' },
          { id: 'png', label: 'PNG — matriciel transparent' },
          { id: 'pdf', label: 'PDF — imprimeur' },
          { id: 'eps', label: 'EPS — imprimeur historique' },
        ]

        var state = {
          document: null,
          components: [],
          schemes: { fullColor: true, black: true, white: true, inverted: true },
          customs: [],
          formats: { ai: true, svg: true, png: true, pdf: true, eps: false },
          favicon: true,
          separator: '-',
          scales: [
            { type: 'web', width: 900, resolution: 72 },
            { type: 'print', width: 2400, resolution: 300 },
          ],
          padding: { mode: 'square', top: 0, right: 0, bottom: 0, left: 0 },
          clientName: '',
          destination: null,
          running: null,
        }

        for (var d = 0; d < DEFAULT_COMPONENTS.length; d += 1) {
          state.components.push({
            name: DEFAULT_COMPONENTS[d],
            artboardIndex: Math.min(d, 0),
          })
        }

        /* ---------------------------------------------------------------- *
         * Aides
         * ---------------------------------------------------------------- */

        function byId(id) {
          return document.getElementById(id)
        }

        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
        }

        function scaleLabel(scale) {
          return scale.width + 'px'
        }

        /** Déclinaisons retenues, personnalisées comprises. */
        function activeSchemes() {
          var list = []
          for (var i = 0; i < SCHEMES.length; i += 1) {
            if (state.schemes[SCHEMES[i].id]) list.push({ id: SCHEMES[i].id })
          }
          for (var j = 0; j < state.customs.length; j += 1) {
            list.push({
              id: 'custom',
              name: state.customs[j].name,
              hex: state.customs[j].hex,
            })
          }
          return list
        }

        /** Configuration transmise au moteur. */
        function buildConfig() {
          var scales = []
          for (var i = 0; i < state.scales.length; i += 1) {
            scales.push({
              type: state.scales[i].type,
              label: scaleLabel(state.scales[i]),
              width: state.scales[i].width,
              resolution: state.scales[i].resolution,
            })
          }
          return {
            clientName: state.clientName,
            outputFolder: state.destination,
            components: state.components,
            colorSchemes: activeSchemes(),
            formats: state.formats,
            scales: scales,
            favicon: state.favicon,
            separator: state.separator,
            padding: state.padding,
          }
        }

        /** Nombre de fichiers prévus par le plan courant. */
        function plannedCount() {
          try {
            return engine.planExport(buildConfig()).length
          } catch (error) {
            return 0
          }
        }

        /* ---------------------------------------------------------------- *
         * Rendu
         * ---------------------------------------------------------------- */

        function renderStatus() {
          var info = ENV_LABEL[ENVIRONMENT]
          byId('status-dot').className = 'status-dot ' + info.dot
          byId('status-label').innerHTML = info.text
        }

        function renderDocument() {
          var card = byId('document-card')
          if (state.document) {
            card.className = 'card'
            card.innerHTML =
              '<p class="doc-name">' +
              escapeHtml(state.document.name) +
              '</p><p class="doc-meta">' +
              state.document.artboardCount +
              ' plan' +
              (state.document.artboardCount > 1 ? 's' : '') +
              ' de travail</p>'
          } else {
            card.className = 'card empty'
            card.innerHTML =
              '<p class="doc-name">Aucun document ouvert</p>' +
              '<p class="doc-meta">Ouvrez et enregistrez le logo dans ' +
              'Illustrator, puis actualisez.</p>'
          }
        }

        function renderComponents() {
          var count = state.document ? state.document.artboardCount : 1
          var html = ''
          for (var i = 0; i < state.components.length; i += 1) {
            var comp = state.components[i]
            var options = ''
            for (var a = 0; a < count; a += 1) {
              options +=
                '<option value="' +
                a +
                '"' +
                (comp.artboardIndex === a ? ' selected' : '') +
                '>Plan ' +
                (a + 1) +
                '</option>'
            }
            html +=
              '<div class="comp-cell"><div class="comp-card">' +
              '<button class="comp-remove" data-remove="' +
              i +
              '" title="Supprimer">&times;</button>' +
              '<div class="comp-preview">Plan ' +
              (comp.artboardIndex + 1) +
              '</div>' +
              '<input class="comp-name" type="text" data-name="' +
              i +
              '" value="' +
              escapeHtml(comp.name) +
              '" />' +
              '<select class="comp-board" data-board="' +
              i +
              '">' +
              options +
              '</select>' +
              '</div></div>'
          }
          byId('comp-grid').innerHTML = html
          byId('comp-count').innerHTML = state.components.length + ' composants'
        }

        function renderSchemes() {
          var html = ''
          for (var i = 0; i < SCHEMES.length; i += 1) {
            var scheme = SCHEMES[i]
            html +=
              '<label class="check-row"><input type="checkbox" data-scheme="' +
              scheme.id +
              '"' +
              (state.schemes[scheme.id] ? ' checked' : '') +
              ' /><span class="swatch" style="background:' +
              scheme.swatch +
              '"></span>' +
              scheme.label +
              '</label>'
          }
          byId('scheme-list').innerHTML = html

          var customs = ''
          for (var j = 0; j < state.customs.length; j += 1) {
            customs +=
              '<div class="list-row"><span class="swatch" style="background:' +
              escapeHtml(state.customs[j].hex) +
              '"></span><span class="label">' +
              escapeHtml(state.customs[j].name) +
              '</span><span class="meta">' +
              escapeHtml(state.customs[j].hex) +
              '</span><button class="kill" data-custom="' +
              j +
              '">&times;</button></div>'
          }
          byId('custom-list').innerHTML =
            customs || '<p class="summary">Aucune couleur personnalisée.</p>'
        }

        function renderFormats() {
          var html = ''
          for (var i = 0; i < FORMATS.length; i += 1) {
            html +=
              '<label class="check-row"><input type="checkbox" data-format="' +
              FORMATS[i].id +
              '"' +
              (state.formats[FORMATS[i].id] ? ' checked' : '') +
              ' />' +
              FORMATS[i].label +
              '</label>'
          }
          byId('format-list').innerHTML = html
        }

        function renderScales() {
          var html = ''
          for (var i = 0; i < state.scales.length; i += 1) {
            var scale = state.scales[i]
            html +=
              '<div class="list-row"><span class="label">' +
              (scale.type === 'print' ? 'Print' : 'Web') +
              '</span><span class="meta">' +
              scale.width +
              ' px · ' +
              scale.resolution +
              ' ppp</span><button class="kill" data-scale="' +
              i +
              '">&times;</button></div>'
          }
          byId('scale-list').innerHTML =
            html || '<p class="summary">Aucune échelle : pas de PNG.</p>'
        }

        function renderNamePreview() {
          var sep = state.separator
          byId('name-preview').innerHTML =
            'Aperçu : ' + escapeHtml('Logo' + sep + 'FullColor' + sep + '900px.png')
        }

        function renderMessages() {
          var html = ''
          var schemes = activeSchemes()

          if (state.components.length === 0) {
            html += '<p class="notice">Ajoutez au moins un composant.</p>'
          }
          if (schemes.length === 0) {
            html += '<p class="notice">Cochez au moins une déclinaison.</p>'
          }
          if (state.document && !state.document.path) {
            html +=
              '<p class="notice">Enregistrez le document : Logo Forge exporte ' +
              'depuis une copie du fichier.</p>'
          }

          var total = plannedCount()
          if (total > 0) {
            html +=
              '<p class="summary">' +
              total +
              ' fichiers prévus · ' +
              state.components.length +
              ' composants × ' +
              schemes.length +
              ' déclinaisons</p>'
          }
          byId('messages').innerHTML = html
        }

        function renderExportButton() {
          var ready =
            state.document !== null &&
            state.document.path !== '' &&
            state.components.length > 0 &&
            activeSchemes().length > 0 &&
            plannedCount() > 0
          byId('open-export').disabled = !ready
        }

        function renderDestination() {
          var element = byId('destination')
          if (state.destination) {
            element.className = 'destination'
            element.innerHTML = escapeHtml(state.destination)
            element.title = state.destination
          } else {
            element.className = 'destination empty'
            element.innerHTML = 'Aucun dossier choisi'
          }
          byId('start-export').disabled = !(
            state.destination && state.clientName.replace(/^\s+|\s+$/g, '')
          )
          byId('export-summary').innerHTML =
            plannedCount() + ' fichiers seront écrits.'
        }

        function renderAll() {
          renderStatus()
          renderDocument()
          renderComponents()
          renderSchemes()
          renderFormats()
          renderScales()
          renderNamePreview()
          renderMessages()
          renderExportButton()
        }

        /* ---------------------------------------------------------------- *
         * Onglets
         * ---------------------------------------------------------------- */

        function switchTabs(container, attribute, prefix) {
          container.onclick = function (event) {
            var key = event.target.getAttribute(attribute)
            if (!key) return
            var buttons = container.getElementsByTagName('button')
            for (var i = 0; i < buttons.length; i += 1) {
              buttons[i].className =
                buttons[i].getAttribute(attribute) === key ? 'tab on' : 'tab'
            }
            var panes = document.querySelectorAll('[id^="' + prefix + '"]')
            for (var j = 0; j < panes.length; j += 1) {
              panes[j].className =
                panes[j].id === prefix + key ? 'pane on' : 'pane'
            }
          }
        }

        switchTabs(byId('tabs'), 'data-tab', 'pane-')
        switchTabs(byId('subtabs'), 'data-sub', 'sub-')

        /* ---------------------------------------------------------------- *
         * Interactions
         * ---------------------------------------------------------------- */

        byId('comp-grid').onclick = function (event) {
          var remove = event.target.getAttribute('data-remove')
          if (remove === null) return
          state.components.splice(parseInt(remove, 10), 1)
          renderComponents()
          renderMessages()
          renderExportButton()
        }

        byId('comp-grid').onchange = function (event) {
          var board = event.target.getAttribute('data-board')
          if (board === null) return
          state.components[parseInt(board, 10)].artboardIndex = parseInt(
            event.target.value,
            10
          )
          renderComponents()
        }

        byId('comp-grid').oninput = function (event) {
          var name = event.target.getAttribute('data-name')
          if (name === null) return
          state.components[parseInt(name, 10)].name = event.target.value
        }

        byId('add-component').onclick = function () {
          state.components.push({
            name: 'Composant ' + (state.components.length + 1),
            artboardIndex: 0,
          })
          renderComponents()
          renderMessages()
          renderExportButton()
        }

        byId('scheme-list').onclick = function (event) {
          var id = event.target.getAttribute('data-scheme')
          if (!id) return
          state.schemes[id] = event.target.checked
          renderMessages()
          renderExportButton()
        }

        byId('custom-list').onclick = function (event) {
          var index = event.target.getAttribute('data-custom')
          if (index === null) return
          state.customs.splice(parseInt(index, 10), 1)
          renderSchemes()
          renderMessages()
          renderExportButton()
        }

        byId('add-custom').onclick = function () {
          var name = byId('custom-name').value
          var hex = byId('custom-hex').value
          if (!name || !/^#[0-9a-fA-F]{6}$/.test(hex)) {
            byId('messages').innerHTML =
              '<p class="notice">Donnez un nom et une couleur #rrggbb.</p>'
            return
          }
          state.customs.push({ name: name, hex: hex })
          byId('custom-name').value = ''
          renderSchemes()
          renderMessages()
          renderExportButton()
        }

        byId('format-list').onclick = function (event) {
          var id = event.target.getAttribute('data-format')
          if (!id) return
          state.formats[id] = event.target.checked
          renderMessages()
          renderExportButton()
        }

        byId('want-favicon').onchange = function () {
          state.favicon = this.checked
          renderMessages()
        }

        byId('separator').onchange = function () {
          state.separator = this.value
          renderNamePreview()
        }

        byId('scale-list').onclick = function (event) {
          var index = event.target.getAttribute('data-scale')
          if (index === null) return
          state.scales.splice(parseInt(index, 10), 1)
          renderScales()
          renderMessages()
          renderExportButton()
        }

        byId('add-scale').onclick = function () {
          var width = parseInt(byId('scale-width').value, 10)
          var dpi = parseInt(byId('scale-dpi').value, 10)
          if (!width || width <= 0) return
          state.scales.push({
            type: byId('scale-type').value,
            width: width,
            resolution: dpi || 72,
          })
          renderScales()
          renderMessages()
          renderExportButton()
        }

        byId('scale-preset').onchange = function () {
          if (this.value === 'web') {
            state.scales = [{ type: 'web', width: 900, resolution: 72 }]
          } else if (this.value === 'print') {
            state.scales = [{ type: 'print', width: 2400, resolution: 300 }]
          } else {
            state.scales = [
              { type: 'web', width: 900, resolution: 72 },
              { type: 'print', width: 2400, resolution: 300 },
            ]
          }
          renderScales()
          renderMessages()
          renderExportButton()
        }

        function readPadding() {
          var mode = document.querySelector('input[name="padmode"]:checked').value
          var top = parseFloat(byId('pad-top').value) || 0
          if (mode === 'square') {
            state.padding = {
              mode: mode,
              top: top,
              right: top,
              bottom: top,
              left: top,
            }
            byId('pad-right').value = top
            byId('pad-bottom').value = top
            byId('pad-left').value = top
            return
          }
          state.padding = {
            mode: mode,
            top: top,
            right: parseFloat(byId('pad-right').value) || 0,
            bottom: parseFloat(byId('pad-bottom').value) || 0,
            left: parseFloat(byId('pad-left').value) || 0,
          }
        }

        byId('padding-fields').oninput = readPadding
        byId('pane-settings').onchange = function (event) {
          if (event.target.name === 'padmode') readPadding()
        }

        /* ---------------------------------------------------------------- *
         * Document
         * ---------------------------------------------------------------- */

        function applyDocument(next) {
          var before = state.document ? state.document.name : null
          var after = next ? next.name : null
          var boardsBefore = state.document ? state.document.artboardCount : 0
          var boardsAfter = next ? next.artboardCount : 0
          if (before === after && boardsBefore === boardsAfter) return

          state.document = next
          if (!state.clientName && next) {
            var dot = next.name.lastIndexOf('.')
            state.clientName = dot > 0 ? next.name.substring(0, dot) : next.name
            byId('client-name').value = state.clientName
          }
          renderDocument()
          renderComponents()
          renderMessages()
          renderExportButton()
        }

        function refreshDocument() {
          guard('lecture du document', function () {
            engine.readDocumentInfo(function (info) {
              guard('affichage du document', function () {
                applyDocument(info)
              })
            })
          })
        }

        byId('refresh').onclick = refreshDocument

        /* ---------------------------------------------------------------- *
         * Choix du dossier
         * ---------------------------------------------------------------- */

        function chooseFolder(callback) {
          if (window.cep && window.cep.fs && window.cep.fs.showOpenDialog) {
            var result = window.cep.fs.showOpenDialog(
              false,
              true,
              'Dossier de destination du pack',
              '',
              null
            )
            callback(result && result.data && result.data.length ? result.data[0] : null)
            return
          }
          engine.call(
            'lfPathExists',
            [''],
            function () {
              callback(null)
            }
          )
        }

        byId('choose-folder').onclick = function () {
          guard('choix du dossier', function () {
            chooseFolder(function (path) {
              if (!path) return
              state.destination = path
              renderDestination()
            })
          })
        }

        byId('client-name').oninput = function () {
          state.clientName = this.value
          renderDestination()
        }

        /* ---------------------------------------------------------------- *
         * Export
         * ---------------------------------------------------------------- */

        byId('open-export').onclick = function () {
          byId('export-error').innerHTML = ''
          renderDestination()
          byId('export-veil').className = 'veil on'
        }

        byId('cancel-export').onclick = function () {
          byId('export-veil').className = 'veil'
        }

        byId('abort-export').onclick = function () {
          if (state.running) state.running.cancel()
          byId('progress-veil').className = 'veil'
        }

        byId('start-export').onclick = function () {
          guard('export', function () {
            byId('export-veil').className = 'veil'
            byId('progress-veil').className = 'veil on'
            byId('progress-title').innerHTML = 'Export en cours'
            byId('progress-result').innerHTML = ''
            byId('progress-bar').style.width = '0'
            byId('abort-export').innerHTML = 'Annuler'

            state.running = engine.runFullExport(buildConfig(), {
              onProgress: function (done, total, label) {
                byId('progress-bar').style.width =
                  Math.round((done / total) * 100) + '%'
                byId('progress-label').innerHTML =
                  escapeHtml(label) + ' (' + done + '/' + total + ')'
              },
              onDone: function (result) {
                state.running = null
                byId('progress-bar').style.width = '100%'
                byId('progress-title').innerHTML = result.cancelled
                  ? 'Export interrompu'
                  : 'Export terminé'
                byId('progress-label').innerHTML =
                  result.written.length +
                  ' fichiers écrits en ' +
                  engine.formatDuration(result.durationMs)

                var html = ''
                if (result.failures.length > 0) {
                  html +=
                    '<p class="notice error">' +
                    result.failures.length +
                    ' échecs. Détail dans le rapport.</p>'
                }
                if (result.reportPath) {
                  html +=
                    '<p class="notice ok">Rapport : ' +
                    escapeHtml(engine.FOLDERS.report) +
                    '/export-rapport.html</p>'
                }
                byId('progress-result').innerHTML = html
                byId('abort-export').innerHTML = 'Fermer'
              },
              onError: function (message) {
                state.running = null
                byId('progress-veil').className = 'veil'
                byId('export-veil').className = 'veil on'
                byId('export-error').innerHTML =
                  '<p class="notice error">' + escapeHtml(message) + '</p>'
              },
            })
          })
        }

        /* ---------------------------------------------------------------- *
         * Démarrage
         * ---------------------------------------------------------------- */

        var POLL_MS = 3000
        var POLL_FAILURE_LIMIT = 3
        var failures = 0
        var timer = null

        function poll() {
          if (state.running) return
          try {
            engine.readDocumentInfo(function (info) {
              try {
                applyDocument(info)
                failures = 0
              } catch (inner) {
                failures += 1
              }
            })
          } catch (error) {
            failures += 1
          }
          if (failures >= POLL_FAILURE_LIMIT && timer !== null) {
            clearInterval(timer)
            timer = null
            if (window.console) console.warn('CEP mode - polling disabled')
          }
        }

        guard('démarrage', function () {
          renderAll()
          renderDestination()
          refreshDocument()
          timer = setInterval(poll, POLL_MS)
        })
      })()
    </script>
  </body>
</html>
